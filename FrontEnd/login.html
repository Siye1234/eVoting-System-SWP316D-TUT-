<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>eVoting System - Face Login</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        .header {
            background: #006b3c;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .main-container {
            width: 420px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        video {
            border-radius: 5px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #006b3c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #004d2b;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 13px;
            color: gray;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>eVoting System - Face Login</h1>
    </div>

    <div class="main-container">
        <video id="videoLogin" width="360" height="240" autoplay></video>
        <canvas id="canvasLogin" width="360" height="240" style="display:none;"></canvas>
        <button id="loginBtn">Login with Face</button>

        <div class="footer">
            eVoting System - Face Verification Login
        </div>
    </div>

    <script src="faceHandler.js"></script>
    <script>
        const face = new FaceHandler("videoLogin","canvasLogin");

        document.getElementById("loginBtn").addEventListener("click", async () => {
            const faceImage = face.captureFace();

            try {
                const result = await face.sendToBackend("http://192.168.1.25:5000/face-login", { faceImage });

                if (result.status === "success") {
                    alert("Login successful! Redirecting to voting page...");
                    // window.location.href = "voting.html";
                } else {
                    alert("Face not recognized. Try again.");
                }
            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>
