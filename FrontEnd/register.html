<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>eVoting System — Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }
        .header {
            background: #006b3c;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .main-container {
            width: 420px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        label { font-weight: bold; }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #006b3c;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #004d2b; }
        .capture-btn {
            background: #f4b400; color: black;
            margin-bottom: 10px;
        }
        video {
            border-radius: 5px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
        }
        .footer {
            text-align: center; margin-top: 30px;
            font-size: 13px; color: gray;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>eVoting System — Voter Registration</h1>
    </div>

    <div class="main-container">
        <form id="registerForm">

            <label>ID Number</label>
            <input type="text" id="idNumber" placeholder="Enter ID number" required>

            <label>First Name</label>
            <input type="text" id="firstName" placeholder="Enter first name" required>

            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="Enter last name" required>

            <label>Residential Address</label>
            <input type="text" id="address" placeholder="Enter address" required>

            <label>Province</label>
            <select id="province" required>
                <option value="">Select Province</option>
                <option>Gauteng</option>
                <option>KwaZulu-Natal</option>
                <option>Eastern Cape</option>
                <option>Western Cape</option>
                <option>Limpopo</option>
                <option>Mpumalanga</option>
                <option>Free State</option>
                <option>North West</option>
                <option>Northern Cape</option>
            </select>

            <h3>Face Capture</h3>
            <video id="video" width="360" height="240" autoplay></video>
            <button type="button" class="capture-btn" id="captureBtn">Capture Face</button>
            <canvas id="canvas" width="360" height="240" style="display:none;"></canvas>

            <button type="submit">Submit Registration</button>

        </form>

        <div class="footer">
            eVoting System — Digital Voter Registration
        </div>
    </div>

    <script src="faceHandler.js"></script>
    <script>
        const face = new FaceHandler("video", "canvas");

        document.getElementById("captureBtn").addEventListener("click", () => {
            face.captureFace();
        });

        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const payload = {
                idNumber: document.getElementById("idNumber").value,
                firstName: document.getElementById("firstName").value,
                lastName: document.getElementById("lastName").value,
                address: document.getElementById("address").value,
                province: document.getElementById("province").value,
                faceImage: face.canvas.getAttribute("data-image")
            };

            try {
                const result = await face.sendToBackend(
                    "http://192.168.1.25:5000/register",
                    payload
                );

                if (result.status === "error") {
                    alert(result.message);
                } else {
                    alert("Registration successful!");
                    window.location.href = "login.html";
                }

            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>
